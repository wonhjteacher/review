<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘은 여기</title>
<meta name="description" content="담아둔 맛집 중에서 오늘 갈 한 곳을 골라드려요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<!-- 랜딩페이지의 추천 두 코너 전용. style.css 다음에 로드된다 -->
<link rel="stylesheet" href="home.css">
</head>
<body>

<!-- 상단 내비게이션 — 주요 메뉴로 바로 이동. save.html에도 같은 부품이 있다.
     .site-auth(로그인)와 같은 줄에 겹쳐 보이도록 fixed로 얹는다 — style.css 참고.
     "추천"은 로그인한 사람에게만 의미가 있는 코너라 #for-you와 마찬가지로
     hidden으로 시작하고, home.js가 #for-you를 열고 닫을 때 같이 맞춘다.

     "홈" 알약이 브랜드 글자와 겹쳐 보이지만 겹치는 것이 아니다 —
     .site-nav__brand는 모바일에서 display:none이라(style.css), 그 폭에서는
     맨 위로 갈 길이 이 알약 하나뿐이다. 알약 줄은 가로 스크롤되므로
     .site-auth와 겹칠 걱정 없이 여기에 둘 수 있다. -->
<header class="site-nav" id="site-nav">
  <div class="site-nav__top-inner container container--wide">
    <a class="site-nav__brand" href="#hero">오늘은 여기</a>
  </div>
  <nav class="site-nav__menu" aria-label="주요 메뉴">
    <div class="site-nav__menu-inner container container--wide">
      <a class="site-nav__pill" href="#hero" data-nav="hero">홈</a>
      <a class="site-nav__pill" href="save.html">담기</a>
      <a class="site-nav__pill" href="#popular" data-nav="popular">인기</a>
      <a class="site-nav__pill" href="#for-you" id="site-nav-foryou" data-nav="for-you" hidden>추천</a>
    </div>
  </nav>
</header>

<!-- 로그인 (UI-CONTRACT 「.site-auth」). 비워둔다 — auth.js가 상태에 따라 채운다.
     세션 복원 전에는 일부러 비어 있다: 로그인한 사용자에게 로그인 버튼이 깜빡이지 않게. -->
<div class="site-auth" id="site-auth"></div>

<!-- ① Hero — PC에서 2단 (카피 | 사진).
     결과 카드 미리보기는 데모와 함께 뺐다 (DESIGN v3). 그 자리에 사진이 들어온다.
     .photo-slot은 아직 비어 있는 자리다 — 사진이 오면 안의 안내 문구 대신
     <img>를 넣고 점선 테두리를 걷는다 (UI-CONTRACT 「.pick-card」의 .photo-slot 참고). -->
<section id="hero" class="section section--bg hero">
  <div class="container container--wide hero__grid">
    <div class="hero__copy">
      <h1 class="display hero__title">저장은 했는데,<br>오늘 어디 가지?</h1>
      <p class="body-l hero__sub">가보고 싶은 곳을 담아두면<br>오늘 갈 한 곳을 골라드려요.</p>
      <div class="action">
        <!-- 데모가 빠져서 주 CTA가 담기 페이지로 간다. 버튼이 아니라 링크다 —
             페이지 이동은 브라우저 기본 동작으로 한다 (site-nav.js와 같은 결). -->
        <a class="btn-primary" href="save.html">맛집 담으러 가기</a>
      </div>
      <p class="hero__alt"><a class="link-text" href="#popular">요즘 인기 먼저 볼래요</a></p>
    </div>

    <!-- 채워진 사진 자리 (UI-CONTRACT 「.photo-slot」 채워진 상태).
         원본은 img/Korean.png(1MB), 화면에는 JPEG 사본(193KB)을 쓴다. -->
    <div class="photo-slot is-filled hero__photo" data-photo="hero" aria-hidden="true">
      <img class="photo-slot__img" src="img/hero.jpg" alt="">
    </div>
  </div>

  <div class="hero__hint" aria-hidden="true">
    <span class="caption">내려보기</span>
    <span class="hero__arrow"></span>
  </div>
</section>

<!-- ② 오늘 여기 어때? (맞춤 추천) — **로그인한 사람에게만 보인다.** 카드 2장.
     세션 복원이 끝나기 전에는 로그인 여부를 모르므로 hidden으로 시작한다.
     미리 펴두면 비로그인 방문자에게 잠깐 나타났다 접히는 것이 보인다
     (`.site-auth`가 로그인 버튼을 미리 그리지 않는 것과 같은 이유 — CLAUDE.md ⑰). -->
<section id="for-you" class="section section--alt" hidden>
  <div class="container container--wide">
    <h2 class="h1 section__title">오늘 여기 어때?</h2>
    <p class="body pick-reason" id="for-you-reason" hidden></p>
    <ul class="plain-list pick-list pick-list--cards" id="for-you-list"></ul>
    <p class="pick-status" id="for-you-status" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- ③ 지금 인기 — 로그인과 무관하다. 비로그인 방문자가 이 페이지에서
     처음 만나는 실제 데이터라, 세션 복원을 기다리지 않고 바로 채운다.
     카드가 아니라 순위 리스트다 (UI-CONTRACT 「.pick-row」). -->
<section id="popular" class="section section--bg">
  <div class="container container--wide">
    <h2 class="h1 section__title">요즘 사람들이<br>가장 많이 담은 곳</h2>
    <ol class="plain-list pick-list" id="popular-list"></ol>
    <p class="pick-status" id="popular-status" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- ④ 푸터 — PC에서 좌우 배치 -->
<footer class="section--alt footer">
  <div class="container container--wide footer__inner">
    <p class="caption footer__brand">오늘은 여기</p>
    <div class="footer__meta-group">
      <p class="caption footer__meta">담아둔 맛집 중에서 오늘 갈 한 곳을 골라드려요</p>
      <p class="caption footer__meta">2026 · Phase 0 프로토타입</p>
    </div>
  </div>
</footer>

<!-- 담기 결과 알림 (UI-CONTRACT 「.toast」). save.html과 같은 마크업이다.
     스타일은 두 페이지가 함께 쓰므로 save.css가 아니라 style.css에 있다. -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 로그인 창 (UI-CONTRACT 「.auth-dialog」)
     <dialog>인 이유는 .review-panel과 같다 — showModal()이 포커스 가둠·Esc 닫기·
     배경 비활성을 브라우저에게서 공짜로 준다. 직접 만든 오버레이로 대체하지 않는다.
     novalidate인 이유 — 브라우저 기본 말풍선 대신 `~해요`체 문구를 쓰기 위해서다. -->
<dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-dialog-title">
  <div class="auth-dialog__inner">
    <header class="auth-dialog__head">
      <h2 class="h2 auth-dialog__title" id="auth-dialog-title">로그인</h2>
      <button type="button" class="auth-dialog__close" data-action="close-auth" aria-label="닫기">닫기</button>
    </header>

    <form class="auth-dialog__form" id="auth-form" novalidate>
      <div class="auth-dialog__field">
        <label class="auth-dialog__label" for="auth-email">이메일</label>
        <input class="auth-dialog__input" id="auth-email" type="email" name="email"
               autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-dialog__field">
        <label class="auth-dialog__label" for="auth-password">비밀번호</label>
        <input class="auth-dialog__input" id="auth-password" type="password" name="password"
               autocomplete="current-password" placeholder="6자 이상">
      </div>

      <p class="auth-dialog__status" id="auth-status" role="status" aria-live="polite"></p>

      <div class="auth-dialog__actions">
        <button type="submit" class="auth-dialog__submit">로그인</button>
        <button type="button" class="auth-dialog__signup" data-action="sign-up">회원가입</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Supabase 인증 (UMD 번들 — 이 프로젝트는 빌드 도구가 없다).
     버전을 고정한다: wordcloud·pretendard와 같은 방식이다.
     이 줄이 막히면 auth.js가 .site-auth__error를 그리고, 담기만 막힌다.
     검색·리뷰·분석은 로그인과 무관하게 그대로 돈다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="auth.js"></script>
<!-- 순서가 있다. saved-places.js와 popular-places.js는 Auth.client()로 클라이언트를
     받아가므로 auth.js 뒤여야 하고, home.js는 그 둘의 창구를 쓰므로 맨 뒤다. -->
<!-- app.js(체험 데모)는 v3에서 내렸다. 파일은 저장소에 남아 있다 — CLAUDE.md 아키텍처 참고. -->
<script src="saved-places.js"></script>
<script src="popular-places.js"></script>
<script src="home.js"></script>
<script src="site-nav.js"></script>
</body>
</html>
